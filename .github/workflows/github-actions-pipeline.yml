name: Alternative CI/CD Pipeline (GitHub Actions)

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  build_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build the project
      working-directory: CA6/Part1/gradle_basic_demo
      run: |
        chmod +x gradlew
        ./gradlew clean assemble

    - name: Run tests
      working-directory: CA6/Part1/gradle_basic_demo
      run: ./gradlew test

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: spring-boot-app
        path: CA6/Part1/gradle_basic_demo/build/libs/*.jar
