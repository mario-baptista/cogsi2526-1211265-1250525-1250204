name: CI-CD Pipeline (Alternative to Jenkins)

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  build_test_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Application
      working-directory: CA6/Part1/gradle_basic_demo
      run: |
        chmod +x gradlew
        ./gradlew clean assemble

    - name: Run Tests
      working-directory: CA6/Part1/gradle_basic_demo
      run: ./gradlew test

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: spring-boot-app
        path: CA6/Part1/gradle_basic_demo/build/libs/*.jar